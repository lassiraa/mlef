name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev ty check
      - run: uv run --locked --extra dev python scripts/export_schemas.py --check
      - run: uv run --locked --extra dev pytest -v
      - run: uv run --locked mlef --version

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra dev --no-editable --python 3.11
      - run: uv run --locked --extra dev --no-editable pytest -v
        env:
          MLEF_TEST_DOCKER: "1"

  distributions:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - name: Check source distributions exclude example environments
        run: python -c "from pathlib import Path; p = Path('examples/sklearn/.venv'); p.mkdir(parents=True, exist_ok=True); (p / 'exclude_from_distribution.py').write_text('local environment sentinel')"
      - run: uv build
      - run: uv run --locked --extra dev python scripts/check_dist.py dist
