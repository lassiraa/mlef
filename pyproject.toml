[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlef"
version = "0.1.0.dev0"
description = "Run Python experiments in Docker and preserve their results."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
mlef = "mlef.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.1", "ty>=0.0.89"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
required-version = ">=0.17.1"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "DTZ", "E", "F", "I", "N", "PIE", "PT", "RET", "RUF", "SIM", "UP"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.11"
python-platform = "all"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
