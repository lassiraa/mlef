[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlef"
version = "0.1.0rc1"
description = "Run Python experiments in Docker and preserve their results."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2,<3",
    "typing-extensions>=4.12",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
mlef = "mlef.cli:main"

[project.urls]
Documentation = "https://lassiraa.github.io/mlef/"
Repository = "https://github.com/lassiraa/mlef"

[project.optional-dependencies]
dev = [
    "pandas>=3.1.0",
    "pytest>=8",
    "ruff>=0.17.1",
    "scikit-learn>=1.9.1",
    "sphinx>=8,<9",
    "ty>=0.0.89",
    "xgboost-cpu>=3,<3.4 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlef = ["templates/*.txt", "templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
required-version = ">=0.17.1"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "DTZ", "E", "F", "I", "N", "PIE", "PT", "RET", "RUF", "SIM", "UP"]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts", "benchmarks"]

[tool.ty.environment]
python-version = "3.11"
python-platform = "all"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
